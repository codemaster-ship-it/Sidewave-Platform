<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5500"/>
      <stop offset="50%" style="stop-color:#FF7700"/>
      <stop offset="100%" style="stop-color:#FF9900"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5500"/>
      <stop offset="100%" style="stop-color:#FF8800"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Decorative sound waves in background -->
  <g fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linecap="round">
    <path d="M150 480v-80M180 480v-120M210 480v-60M240 480v-100"/>
    <path d="M950 480v-70M980 480v-110M1010 480v-50M1040 480v-90"/>
  </g>
  <!-- Cloud logo -->
  <g transform="translate(200, 180)" filter="url(#shadow)">
    <path fill="url(#cloudGrad)" d="M0 120c0 44-36 80-80 80H40c-22 0-40-18-40-40V60c0-22 18-40 40-40h160c22 0 40 18 40 40v20c0 11 9 20 20 20s20-9 20-20V60c0-44-36-80-80-80H40c-44 0-80 36-80 80v60c0 44 36 80 80 80h160c44 0 80-36 80-80v-60z"/>
    <!-- Sound waves on cloud -->
    <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <path d="M20 80v-30M50 80v-50M80 80v-20M110 80v-40"/>
    </g>
  </g>
  <!-- Text -->
  <text x="520" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="-2">tunecloud</text>
  <text x="520" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="1">Stream · Moments · Tracks</text>
  <!-- Tagline -->
  <text x="520" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.8)" text-anchor="middle">Share your sound. Find your people.</text>
</svg>